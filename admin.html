<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Digital ID Studio</title>
<style>
:root{--p:#1c5fc0;--bd:#dce6f3;--bg:#f4f8ff;--ink:#17243b;--mu:#5d6f89;--ok:#16734a;--warn:#b45309;--err:#b42318}
*{box-sizing:border-box;margin:0}
body{font:14px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.bar{position:sticky;top:0;z-index:20;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:#fff;border-bottom:1px solid var(--bd)}
.bar b{font-size:16px;margin-right:6px}
.bar select{max-width:220px}
#st{font-size:12px;color:var(--ok)}
button,select{font:inherit;font-weight:600;cursor:pointer;border-radius:10px;border:1px solid var(--bd);background:#fff;padding:7px 12px;color:var(--ink)}
button:hover{border-color:var(--p)}
button:disabled{opacity:.6;cursor:wait}
.pri{background:var(--p);border-color:var(--p);color:#fff}
.dd{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);min-width:290px;background:#fff;border:1px solid var(--bd);border-radius:12px;box-shadow:0 14px 30px rgba(10,37,64,.18);padding:6px;display:none;z-index:30}
.dd.open .menu{display:block}
.menu button{display:block;width:100%;text-align:left;border:0;padding:9px 10px}
.menu button small{display:block;font-weight:400;color:var(--mu);font-size:12px}
.menu button:hover{background:var(--bg)}
.menu hr{border:0;border-top:1px solid var(--bd);margin:4px 0}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:18px;max-width:1180px;margin:16px auto;padding:0 14px}
#chk{background:#fff;border:1px solid var(--bd);border-radius:14px;margin-bottom:12px;padding:12px 14px;font-size:13px}
#chk h4{font-size:13px;margin-bottom:6px;display:flex;justify-content:space-between}
#chk ul{list-style:none;padding:0;display:grid;gap:3px}
#chk li.err{color:var(--err)}#chk li.warn{color:var(--warn)}#chk li.info{color:var(--mu)}#chk li.ok{color:var(--ok)}
details{background:#fff;border:1px solid var(--bd);border-radius:14px;margin-bottom:12px}
summary{padding:13px 16px;font-weight:700;cursor:pointer}
.body{padding:0 16px 16px;display:grid;gap:12px}
label{display:grid;gap:5px;font-weight:600;font-size:12.5px}
.ck{display:flex;gap:8px;align-items:center}
.f{width:100%;padding:9px 10px;border:1.5px solid var(--bd);border-radius:10px;font:inherit;background:#fbfdff;font-weight:400}
.f:focus{outline:3px solid rgba(40,120,223,.25);border-color:var(--p)}
textarea.f{min-height:84px;resize:vertical}
.hint{font-size:12px;color:var(--mu);font-weight:400}
.up{display:flex;gap:12px;align-items:center}
.up img{width:56px;height:56px;border-radius:12px;object-fit:cover;border:1px solid var(--bd);flex:none}
.up>div{flex:1;display:grid;gap:6px;min-width:0}
.mi{display:flex;gap:8px;align-items:center;border:1px solid var(--bd);border-radius:10px;padding:8px;background:#fcfdff}
.mi>div{flex:1;display:grid;gap:6px;min-width:0}
.mi button{padding:5px 9px}
.th{width:56px;height:56px;border-radius:10px;border:1px solid var(--bd);overflow:hidden;background:#eef3fa;flex:none}
.th img,.th video{width:100%;height:100%;object-fit:cover}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.f{flex:1;min-width:120px}
.pr{display:flex;flex-wrap:wrap;gap:8px}
.pr button{padding:6px 10px 6px 6px;display:flex;align-items:center;gap:7px;font-size:12.5px}
.pr i{width:34px;height:20px;border-radius:6px;display:block}
.pr .on{border-color:var(--p);box-shadow:0 0 0 2px var(--p)}
.cols{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
input[type=color]{width:100%;height:40px;border:1.5px solid var(--bd);border-radius:10px;padding:2px;background:#fff}
aside{position:sticky;top:64px;align-self:start}
.dev{display:flex;gap:6px;margin-bottom:8px}
.dev button{flex:1;padding:6px}
.dev .on{background:var(--p);color:#fff;border-color:var(--p)}
.frame{display:flex;justify-content:center;background:#e6edf8;border:1px solid var(--bd);border-radius:20px;padding:8px;height:calc(100vh - 150px);min-height:480px}
.frame iframe{width:100%;max-width:100%;height:100%;border:0;border-radius:14px;background:#fff}
aside small{display:block;margin:6px 4px;color:var(--mu)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#17243b;color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%)}
@media(max-width:960px){.wrap{grid-template-columns:1fr}aside{position:static}.frame{height:640px}.cols{grid-template-columns:repeat(2,1fr)}}

#st{margin-left:8px}
#dlm{margin-left:auto;font-size:12px;font-weight:600}
#bk .bn{background:#fff7e6;border:1px solid #f5d38a;border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:13px;display:grid;gap:8px}
#bk .bn span{color:#6b4e0a}
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,37,64,.55);display:grid;place-items:center;padding:14px}
.modal[hidden]{display:none}
.mbox{background:#fff;border-radius:16px;width:min(760px,100%);max-height:92vh;overflow:auto;padding:16px 18px 18px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.mbox h3{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;font-size:16px}
.mbox h3 button{padding:3px 10px}
.tl{list-style:none;padding:0;display:grid;gap:6px;margin:10px 0 0}
.tl li{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--bd);border-radius:10px;padding:8px 10px}
.tl .b{font-size:12px;font-weight:700}
.tl .ok{color:var(--ok)}.tl .warn{color:var(--warn)}.tl .err{color:var(--err)}.tl .info{color:var(--mu)}
.tl small{display:block;color:var(--mu);word-break:break-all;font-weight:400}
.ab{display:inline-block;font-weight:600;border:1px solid var(--bd);border-radius:10px;padding:6px 12px;color:var(--ink);text-decoration:none;background:#fff}
.ab:hover{border-color:var(--p)}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px;align-items:start}
.pgrid .side{display:grid;gap:10px}
#pc{width:100%;height:auto;border:1px solid var(--bd);border-radius:8px;background:#fff;display:block}
@media(max-width:700px){.pgrid{grid-template-columns:1fr}.tl li{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="bar">
  <b>Digital ID Studio</b>
  <select id="projSel" title="Switch client"></select>
  <button id="bNew">+ New client</button>
  <button id="bDup">Duplicate</button>
  <button id="bDel">Delete</button>
  <button id="bImp" title="Import a project backup (.json) or an existing config.js">Import</button>
  <button id="bTest" title="Check every link on this ID">Test links</button>
  <button id="bPoster" title="Printable QR poster (PDF / PNG)">QR poster</button>
  <span id="dlm"></span>
  <span id="st"></span>
  <div class="dd" id="dd">
    <button class="pri" id="bDl">Download ▾</button>
    <div class="menu">
      <button data-dl="site">Full site (ZIP)<small>Everything needed to deploy this client's ID on its own</small></button>
      <button data-dl="update">Update pack (ZIP)<small>Only config.js + assets, to refresh a site that is already live</small></button>
      <button data-dl="single">Single HTML file<small>One file with all code and photos inside</small></button>
      <hr>
      <button data-dl="project">Client backup (.json)<small>Re-import later to keep editing</small></button>
      <button data-dl="all">Back up all clients now<small id="bkInfo">Saves one file with every client</small></button>
      <button data-dl="folder">Choose backup folder…<small>Pick a cloud-synced folder (Chrome / Edge)</small></button>
      <hr>
      <button data-dl="tab">Open full preview in new tab</button>
    </div>
  </div>
</div>
<input type="file" id="impFile" accept=".json,.js" hidden>
<div class="wrap">
  <main>
    <div id="bk"></div>
    <div id="chk"></div>
    <div id="form"></div>
  </main>
  <aside>
    <div class="dev"><button data-dev="375" class="on">Phone</button><button data-dev="768">Tablet</button><button data-dev="100%">Desktop</button></div>
    <div class="frame"><iframe id="pv" title="Live preview"></iframe></div>
    
  </aside>
</div>
<div id="toast" role="status"></div>
<div class="modal" id="modal" hidden><div class="mbox" role="dialog" aria-modal="true"><h3><span id="mt"></span><button id="mx" aria-label="Close">✕</button></h3><div id="mb"></div></div></div>

<script>
window.SITE_FILES = {"index.html":"<!doctype html>\n<html lang=\"en\">\n  <head>\n    <meta charset=\"UTF-8\" />\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n    <meta name=\"theme-color\" content=\"{{THEME}}\" />\n    {{META}}\n    <title>{{TITLE}}<\/title>\n\n    <!-- Lets the page hide reveal-on-scroll items only when JavaScript is running -->\n    <script>\n      document.documentElement.classList.add(\"js\");\n    <\/script>\n\n    <!-- Font -->\n    <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\" />\n    <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin />\n    <link\n      href=\"https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap\"\n      rel=\"stylesheet\"\n    />\n\n    <link rel=\"stylesheet\" href=\"style.css\" />\n    <link rel=\"stylesheet\" href=\"templates.css\" />\n\n    <!-- Icons -->\n    <link\n      rel=\"stylesheet\"\n      href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css\"\n    />\n  <\/head>\n\n  <body>\n    <div class=\"scroll-progress\" id=\"scrollProgress\" aria-hidden=\"true\"><\/div>\n\n    <main class=\"page\">\n      <!-- ================= DIGITAL ID CARD ================= -->\n      <article class=\"card\">\n        <header class=\"hero\">\n          <svg\n            class=\"hero__art\"\n            id=\"heroArt\"\n            viewBox=\"0 0 440 210\"\n            preserveAspectRatio=\"xMidYMid slice\"\n            aria-hidden=\"true\"\n          >\n            <circle class=\"orb orb--1\" cx=\"385\" cy=\"40\" r=\"72\" />\n            <circle class=\"orb orb--2\" cx=\"36\" cy=\"175\" r=\"52\" />\n            <path\n              id=\"flightPath\"\n              class=\"route\"\n              d=\"M-20 150 C 90 30, 220 190, 460 50\"\n            />\n            <g class=\"plane\">\n              <path d=\"M0 0 L-18 -8 L-12 0 L-18 8 Z\" />\n              <path class=\"plane__fold\" d=\"M0 0 L-12 0 L-18 8 Z\" />\n              <animateMotion dur=\"9s\" repeatCount=\"indefinite\" rotate=\"auto\">\n                <mpath href=\"#flightPath\" />\n              <\/animateMotion>\n            <\/g>\n          <\/svg>\n\n          <div class=\"top\">\n            <div class=\"brand-logo\">\n              <img\n                src=\"{{LOGO_SRC}}\"\n                alt=\"{{NAME}} logo\"\n              />\n            <\/div>\n            <p>Digital ID<\/p>\n          <\/div>\n        <\/header>\n\n        <section class=\"identity\">\n          <div class=\"profile\">\n            <img\n              src=\"{{PROFILE_SRC}}\"\n              alt=\"{{NAME}}\"\n              id=\"profileImage\"\n            />\n          <\/div>\n\n          <h1 id=\"profileName\">{{NAME}}<\/h1>\n          <p class=\"role\">{{TAGLINE}}<\/p>\n\n          <p class=\"bio\">{{BIO}}<\/p>\n\n          <div class=\"action-buttons\">\n            <a href=\"tel:{{TEL}}\" class=\"action-btn save-btn\">\n              <i class=\"fa-solid fa-phone\"><\/i>\n              Call Now\n            <\/a>\n\n            <button\n              type=\"button\"\n              class=\"action-btn location-btn\"\n              onclick=\"getLocation()\"\n            >\n              <i class=\"fa-solid fa-location-dot\"><\/i>\n              Get Location\n            <\/button>\n\n            <a href=\"#feedback\" class=\"action-btn feedback-jump\">\n              <i class=\"fa-solid fa-star\"><\/i>\n              Give Feedback\n            <\/a>\n          <\/div>\n        <\/section>\n\n        <div class=\"line\"><\/div>\n\n        <!-- ================= OUR SOCIAL MEDIA ================= -->\n        <section class=\"block reveal\" aria-labelledby=\"socialTitle\">\n          <h2 class=\"block__title\" id=\"socialTitle\">\n            <i class=\"fa-solid fa-share-nodes\" aria-hidden=\"true\"><\/i>\n            Our Social Media\n          <\/h2>\n\n          <div class=\"tiles\">\n            <a\n              href=\"{{SOC_instagram}}\"\n              class=\"tile tile--instagram\"\n              target=\"_blank\"\n              rel=\"noopener noreferrer\"\n            >\n              <span class=\"tile__icon\"\n                ><i class=\"fa-brands fa-instagram\"><\/i\n              ><\/span>\n              <span class=\"tile__label\">Instagram<\/span>\n            <\/a>\n\n            <a\n              href=\"{{SOC_facebook}}\"\n              class=\"tile tile--facebook\"\n              target=\"_blank\"\n              rel=\"noopener noreferrer\"\n            >\n              <span class=\"tile__icon\"\n                ><i class=\"fa-brands fa-facebook-f\"><\/i\n              ><\/span>\n              <span class=\"tile__label\">Facebook<\/span>\n            <\/a>\n\n            <a\n              href=\"{{SOC_linkedin}}\"\n              class=\"tile tile--linkedin\"\n              target=\"_blank\"\n              rel=\"noopener noreferrer\"\n            >\n              <span class=\"tile__icon\"\n                ><i class=\"fa-brands fa-linkedin-in\"><\/i\n              ><\/span>\n              <span class=\"tile__label\">LinkedIn<\/span>\n            <\/a>\n\n            <a\n              href=\"#\"\n              id=\"whatsappLink\"\n              class=\"tile tile--whatsapp\"\n              target=\"_blank\"\n              rel=\"noopener noreferrer\"\n            >\n              <span class=\"tile__icon\"\n                ><i class=\"fa-brands fa-whatsapp\"><\/i\n              ><\/span>\n              <span class=\"tile__label\">WhatsApp<\/span>\n            <\/a>\n          <\/div>\n        <\/section>\n\n        <!-- ================= SAVE AND SHARE ================= -->\n        <section class=\"block reveal\" aria-labelledby=\"toolsTitle\">\n          <h2 class=\"block__title\" id=\"toolsTitle\">\n            <i class=\"fa-solid fa-paper-plane\" aria-hidden=\"true\"><\/i>\n            Save and Share\n          <\/h2>\n\n          <div class=\"tiles\" id=\"tools\">\n            <button type=\"button\" class=\"tile tile--tool\" data-action=\"save\">\n              <span class=\"tile__icon\"\n                ><i class=\"fa-solid fa-address-book\"><\/i\n              ><\/span>\n              <span class=\"tile__label\">Save contact<\/span>\n            <\/button>\n\n            <button type=\"button\" class=\"tile tile--tool\" data-action=\"share\">\n              <span class=\"tile__icon\"\n                ><i class=\"fa-solid fa-share-nodes\"><\/i\n              ><\/span>\n              <span class=\"tile__label\">Share card<\/span>\n            <\/button>\n\n            <button type=\"button\" class=\"tile tile--tool\" data-action=\"copy\">\n              <span class=\"tile__icon\"><i class=\"fa-solid fa-link\"><\/i><\/span>\n              <span class=\"tile__label\">Copy link<\/span>\n            <\/button>\n\n            <button type=\"button\" class=\"tile tile--tool\" data-action=\"qr\">\n              <span class=\"tile__icon\"><i class=\"fa-solid fa-qrcode\"><\/i><\/span>\n              <span class=\"tile__label\">QR code<\/span>\n            <\/button>\n          <\/div>\n        <\/section>\n\n        <!-- ================= ABOUT ME ================= -->\n        <section class=\"about-me reveal\">\n          <h3 class=\"block__title\">\n            <i class=\"fa-solid fa-circle-info\" aria-hidden=\"true\"><\/i>\n            About Me\n          <\/h3>\n          <p>{{ABOUT}}<\/p>\n        <\/section>\n\n        <!-- ================= INFO BOXES ================= -->\n        <div class=\"info-boxes reveal\">\n          <div class=\"info-box\">\n            <div class=\"info-icon\"><i class=\"fa-solid fa-award\"><\/i><\/div>\n            <p class=\"info-number\">{{S0V}}<\/p>\n            <p class=\"info-label\">{{S0L}}<\/p>\n          <\/div>\n\n          <div class=\"info-box\">\n            <div class=\"info-icon\"><i class=\"fa-solid fa-users\"><\/i><\/div>\n            <p class=\"info-number\">{{S1V}}<\/p>\n            <p class=\"info-label\">{{S1L}}<\/p>\n          <\/div>\n\n          <div class=\"info-box smile-box\">\n            <div class=\"info-icon\"><i class=\"fa-solid fa-face-smile\"><\/i><\/div>\n            <p class=\"info-number\">{{S2V}}<\/p>\n            <p class=\"info-label\">{{S2L}}<\/p>\n          <\/div>\n        <\/div>\n      <\/article>\n\n      <!-- ================= FEEDBACK ================= -->\n      <section class=\"card feedback-section reveal\" id=\"feedback\">\n        <div class=\"feedback-heading\">\n          <h2>{{FBT}}<\/h2>\n          <p>{{FBS}}<\/p>\n        <\/div>\n\n        <form id=\"feedbackForm\">\n          <div class=\"rating-label\">How was your experience?<\/div>\n          <div\n            class=\"star-rating\"\n            role=\"radiogroup\"\n            aria-label=\"Rate your experience\"\n          >\n            <button\n              type=\"button\"\n              class=\"star\"\n              data-rating=\"1\"\n              aria-label=\"1 star\"\n              aria-pressed=\"false\"\n            >\n              ★\n            <\/button>\n            <button\n              type=\"button\"\n              class=\"star\"\n              data-rating=\"2\"\n              aria-label=\"2 stars\"\n              aria-pressed=\"false\"\n            >\n              ★\n            <\/button>\n            <button\n              type=\"button\"\n              class=\"star\"\n              data-rating=\"3\"\n              aria-label=\"3 stars\"\n              aria-pressed=\"false\"\n            >\n              ★\n            <\/button>\n            <button\n              type=\"button\"\n              class=\"star\"\n              data-rating=\"4\"\n              aria-label=\"4 stars\"\n              aria-pressed=\"false\"\n            >\n              ★\n            <\/button>\n            <button\n              type=\"button\"\n              class=\"star\"\n              data-rating=\"5\"\n              aria-label=\"5 stars\"\n              aria-pressed=\"false\"\n            >\n              ★\n            <\/button>\n          <\/div>\n          <p id=\"ratingHint\" class=\"rating-hint\">Tap a star to rate us<\/p>\n\n          <div class=\"suggestion-group\">\n            <div class=\"rating-label\">What did you like?<\/div>\n            <div class=\"suggestion-chips\">\n              <label class=\"suggestion-chip\"\n                ><input\n                  type=\"checkbox\"\n                  name=\"positive\"\n                  value=\"friendly and helpful service\"\n                /><span>😊 Friendly service<\/span><\/label\n              >\n              <label class=\"suggestion-chip\"\n                ><input\n                  type=\"checkbox\"\n                  name=\"positive\"\n                  value=\"smooth travel planning\"\n                /><span>🧭 Smooth planning<\/span><\/label\n              >\n              <label class=\"suggestion-chip\"\n                ><input\n                  type=\"checkbox\"\n                  name=\"positive\"\n                  value=\"great holiday packages\"\n                /><span>🌴 Great packages<\/span><\/label\n              >\n              <label class=\"suggestion-chip\"\n                ><input\n                  type=\"checkbox\"\n                  name=\"positive\"\n                  value=\"quick responses\"\n                /><span>⚡ Quick responses<\/span><\/label\n              >\n              <label class=\"suggestion-chip\"\n                ><input\n                  type=\"checkbox\"\n                  name=\"positive\"\n                  value=\"good value for money\"\n                /><span>💰 Good value<\/span><\/label\n              >\n              <label class=\"suggestion-chip\"\n                ><input\n                  type=\"checkbox\"\n                  name=\"positive\"\n                  value=\"clear communication\"\n                /><span>💬 Clear communication<\/span><\/label\n adius:20px 20px 20px 4px}\n[data-template=forest] .about-me{border-left:4px solid var(--sky);border-radius:6px var(--r-tile) var(--r-tile) 6px}\n[data-template=forest] .block__title i{border-radius:50%}\n\n/* ===== beach: sand and sea, pill buttons ===== */\nbody[data-template=beach]{background:linear-gradient(180deg,#fff6e0,#e3f8fb 70%)}\n[data-template=beach] .card{background:rgba(255,255,255,.9);border:1px solid #fff;box-shadow:0 24px 50px rgba(8,145,178,.2)}\n[data-template=beach] .hero,[data-template=beach] .feedback-heading{background:linear-gradient(180deg,var(--blue-deep),var(--sky));border-radius:0 0 50% 50%/0 0 70px 70px}\n[data-template=beach] .identity{margin-top:-58px}\n[data-template=beach] .profile{background:linear-gradient(135deg,var(--sun),#fde68a)}\n[data-template=beach] .action-btn,[data-template=beach] .submit-review{border-radius:999px}\n[data-template=beach] .tile__icon{border-radius:22px}\n[data-template=beach] .block__title i{background:var(--sun);color:#fff;border-radius:50%}\n[data-template=beach] .info-box{border-radius:22px;border-color:color-mix(in srgb,var(--sky) 40%,#fff)}\n","style.css":"\n\n:root {\n    --navy: #0a2540;\n    --blue-deep: #1c5fc0;\n    --blue: #2878df;\n    --sky: #4b9cff;\n    --ice: #eaf3ff;\n    --mist: #f5f9ff;\n    --line: #dce6f3;\n    --ink: #17243b;\n    --muted: #5d6f89;\n    --sun: #ffb020;\n    --ok: #16734a;\n\n    --r-card: 28px;\n    --r-tile: 18px;\n    --r-field: 14px;\n\n    --font: \"Plus Jakarta Sans\", system-ui, -apple-system, \"Segoe UI\", Roboto, Arial, sans-serif;\n    --ease: cubic-bezier(0.2, 0.8, 0.2, 1);\n}\n\n/* ================= RESET + SCROLL ================= */\n* {\n    margin: 0;\n    padding: 0;\n    box-sizing: border-box;\n}\n\nhtml {\n    scroll-behavior: smooth;\n    scroll-padding-top: 16px;\n    scrollbar-width: thin;\n    scrollbar-color: var(--sky) var(--ice);\n}\n\nhtml::-webkit-scrollbar { width: 10px; }\nhtml::-webkit-scrollbar-track { background: var(--ice); }\nhtml::-webkit-scrollbar-thumb {\n    background: linear-gradient(180deg, var(--sky), var(--blue-deep));\n    border-radius: 999px;\n    border: 2px solid var(--ice);\n}\n\nbody {\n    min-height: 100vh;\n    font-family: var(--font);\n    color: var(--ink);\n    -webkit-font-smoothing: antialiased;\n    background:\n        radial-gradient(900px 520px at 90% -10%, #cfe4ff 0, transparent 60%),\n        radial-gradient(700px 520px at -10% 45%, #dff0ff 0, transparent 60%),\n        linear-gradient(180deg, #eef5ff, #f8fbff);\n    background-attachment: fixed;\n}\n\nbutton,\ninput,\ntextarea {\n    font-family: inherit;\n}\n\na:focus-visible,\nbutton:focus-visible {\n    outline: 3px solid rgba(40, 120, 223, 0.5);\n    outline-offset: 3px;\n}\n\n.page {\n    width: 100%;\n    max-width: 440px;\n    margin: 0 auto;\n    padding: 20px 14px 64px;\n    display: grid;\n    gap: 22px;\n}\n\n/* ================= SCROLL PROGRESS + BACK TO TOP ================= */\n.scroll-progress {\n    position: fixed;\n    top: 0;\n    left: 0;\n    z-index: 50;\n    width: 100%;\n    height: 4px;\n    transform: scaleX(0);\n    transform-origin: 0 50%;\n    background: linear-gradient(90deg, var(--sky), var(--sun));\n    border-radius: 0 4px 4px 0;\n}\n\n.to-top {\n    position: fixed;\n    right: 16px;\n    bottom: 18px;\n    z-index: 60;\n    width: 46px;\n    height: 46px;\n    display: grid;\n    place-items: center;\n    border: 0;\n    border-radius: 50%;\n    color: #fff;\n    font-size: 15px;\n    background: linear-gradient(135deg, var(--blue-deep), var(--sky));\n    box-shadow: 0 10px 22px rgba(28, 95, 192, 0.35);\n    cursor: pointer;\n    opacity: 0;\n    pointer-events: none;\n    transform: translateY(14px) scale(0.9);\n    transition: opacity 0.3s var(--ease), transform 0.3s var(--ease);\n}\n\n.to-top.is-show {\n    opacity: 1;\n    pointer-events: auto;\n    transform: none;\n}\n\n.to-top:active {\n    transform: scale(0.94);\n}\n\n/* ================= REVEAL ON SCROLL ================= */\n.js .reveal {\n    opacity: 0;\n    transform: translateY(18px);\n    transition: opacity 0.7s var(--ease), transform 0.7s var(--ease);\n}\n\n.js .reveal.is-in {\n    opacity: 1;\n    transform: none;\n}\n\n/* ================= CARD ================= */\n.card {\n    width: 100%;\n    overflow: hidden;\n    text-align: center;\n    border-radius: var(--r-card);\n    background: #fff;\n    border: 1px solid rgba(220, 230, 243, 0.9);\n    box-shadow:\n        0 22px 50px rgba(28, 95, 192, 0.16),\n        0 2px 6px rgba(10, 37, 64, 0.06);\n}\n\n/* ================= HERO ================= */\n.hero {\n    position: relative;\n    min-height: 168px;\n    padding: 18px 20px 70px;\n    color: #fff;\n    background: linear-gradient(135deg, #1c5fc0 0%, #2878df 45%, #4b9cff 100%);\n    border-radius: 0 0 50% 50% / 0 0 36px 36px;\n    overflow: hidden;\n}\n\n.hero__art {\n    position: absolute;\n    inset: 0;\n    width: 100%;\n    height: 100%;\n    pointer-events: none;\n}\n\n.orb--1 { fill: rgba(255, 255, 255, 0.1); }\n.orb--2 { fill: rgba(255, 255, 255, 0.07); }\n\n.route {\n    fill: none;\n    stroke: rgba(255, 255, 255, 0.55);\n    stroke-width: 1.6;\n    stroke-dasharray: 3 7;\n    stroke-linecap: round;\n}\n\n.plane {\n    fill: #fff;\n    filter: drop-shadow(0 3px 4px rgba(10, 37, 64, 0.3));\n}\n\n.plane__fold {\n    fill: rgba(28, 95, 192, 0.28);\n}\n\n.top {\n    position: relative;\n    z-index: 1;\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n}\n\n.brand-logo {\n    width: 44px;\n    height: 44px;\n    flex-shrink: 0;\n    border-radius: 50%;\n    overflow: hidden;\n    border: 2px solid rgba(255, 255, 255, 0.85);\n    background: #fff;\n}\n\n.brand-logo img {\n    width: 100%;\n    height: 100%;\n    display: block;\n    object-fit: cover;\n}\n\n.top p {\n    padding: 6px 13px;\n    border-radius: 999px;\n    background: rgba(255, 255, 255, 0.18);\n    border: 1px solid rgba(255, 255, 255, 0.3);\n    font-size: 12px;\n    font-weight: 600;\n    letter-spacing: 0.06em;\n    color: #fff;\n}\n\n/* ================= IDENTITY ================= */\n.identity {\n    position: relative;\n    margin-top: -48px;\n    padding: 0 22px 8px;\n}\n\n.profile {\n    width: 98px;\n    height: 98px;\n    margin: 0 auto 14px;\n    padding: 4px;\n    border-radius: 50%;\n    background: linear-gradient(135deg, var(--sky), var(--blue-deep));\n    box-shadow: 0 12px 26px rgba(28, 95, 192, 0.32);\n    animation: pop 0.75s var(--ease) 0.1s both;\n}\n\n.profile img {\n    width: 100%;\n    height: 100%;\n    display: block;\n    object-fit: cover;\n    border-radius: 50%;\n    border: 3px solid #fff;\n    background: #fff;\n}\n\nh1 {\n    font-size: 27px;\n    font-weight: 800;\n    letter-spacing: -0.02em;\n    line-height: 1.15;\n    color: var(--navy);\n    overflow-wrap: anywhere;\n    animation: rise 0.6s var(--ease) 0.35s both;\n}\n\n.role {\n    margin-top: 6px;\n    font-size: 15px;\n    font-weight: 600;\n    color: var(--blue);\n    animation: rise 0.6s var(--ease) 0.45s both;\n}\n\n.bio {\n    max-width: 36ch;\n    margin: 14px auto 0;\n    font-size: 14.5px;\n    line-height: 1.7;\n    color: var(--muted);\n    animation: rise 0.6s var(--ease) 0.55s both;\n}\n\n@keyframes pop {\n    0%   { opacity: 0; transform: scale(0.6); }\n    70%  { opacity: 1; transform: scale(1.06); }\n    100% { opacity: 1; transform: scale(1); }\n}\n\n@keyframes rise {\n    from { opacity: 0; transform: translateY(12px); }\n    to   { opacity: 1; transform: none; }\n}\n\n/* ================= ACTION BUTTONS ================= */\n.action-buttons {\n    display: grid;\n    grid-template-columns: repeat(2, minmax(0, 1fr));\n    gap: 10px;\n    margin-top: 22px;\n    animation: rise 0.6s var(--ease) 0.65s both;\n}\n\n.action-btn {\n    min-width: 0;\n    min-height: 50px;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    gap: 8px;\n    padding: 10px 8px;\n    border-radius: var(--r-field);\n    font-size: 13.5px;\n    font-weight: 700;\n    text-decoration: none;\n    cursor: pointer;\n    transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease);\n}\n\n.action-btn:hover { transform: translateY(-2px); }\n.action-btn:active { transform: scale(0.98); }\n\n.save-btn {\n    color: #fff;\n    border: 0;\n    background: linear-gradient(120deg, var(--blue-deep), var(--sky));\n    box-shadow: 0 10px 20px rgba(40, 120, 223, 0.32);\n}\n\n.location-btn {\n    color: var(--blue-deep);\n    background: #fff;\n    border: 1.5px solid #cbdcf2;\n}\n\n.location-btn:hover { box-shadow: 0 8px 18px rgba(40, 120, 223, 0.16); }\n\n.feedback-jump {\n    grid-column: 1 / -1;\n    color: var(--blue-deep);\n    background: var(--ice);\n    border: 1.5px solid #cbdcf2;\n}\n\n.feedback-jump i { color: var(--sun); }\n\n/* ================= DIVIDER ================= */\n.line {\n    margin: 24px 22px 0;\n    border-top: 2px dashed var(--line);\n}\n\n/* ================= BLOCKS + TITLES ================= */\n.block {\n    padding: 24px 18px 0;\n}\n\n.block__title {\n    display: flex;\n    align-items: center;\n    gap: 10px;\n    margin-bottom: 14px;\n    padding: 0 4px;\n    font-size: 17px;\n    font-weight: 800;\n    letter-spacing: -0.01em;\n    text-align: left;\n    color: var(--navy);\n}\n\n.block__title i {\n    width: 30px;\n    height: 30px;\n    flex-shrink: 0;\n    display: grid;\n    place-items: center;\n    border-radius: 10px;\n    font-size: 13px;\n    color: #fff;\n    background: linear-gradient(135deg, var(--blue), var(--sky));\n}\n\n/* ================= TILES (social + save/share) ================= */\n.tiles {\n    display: grid;\n    grid-template-columns: repeat(4, minmax(0, 1fr));\n    gap: 6px;\n}\n\n.tile {\n    min-width: 0;\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    gap: 9px;\n    padding: 12px 2px 10px;\n    border: 0;\n    border-radius: var(--r-tile);\n    background: transparent;\n    color: var(--ink);\n    font-size: 12px;\n    font-weight: 600;\n    line-height: 1.3;\n    text-align: center;\n    text-decoration: none;\n    cursor: pointer;\n    transition: transform 0.25s var(--ease), background 0.25s;\n}\n\n.tile:hover {\n    background: var(--ice);\n    transform: translateY(-3px);\n}\n\n.tile:active { transform: scale(0.96); }\n\n.tile__icon {\n    width: 56px;\n    height: 56px;\n    display: grid;\n    place-items: center;\n    border-radius: var(--r-tile);\n    color: #fff;\n    font-size: 24px;\n    box-shadow: 0 8px 16px rgba(23, 36, 59, 0.18);\n    transition: background 0.25s, color 0.25s;\n}\n\n.tile--instagram .tile__icon { background: linear-gradient(45deg, #f9a03f, #e1306c 55%, #a830c4); }\n.tile--facebook  .tile__icon { background: #1877f2; }\n.tile--linkedin  .tile__icon { background: #0a66c2; }\n.tile--whatsapp  .tile__icon { background: #25d366; }\n\n.tile--tool .tile__icon {\n    font-size: 21px;\n    color: var(--blue);\n    background: var(--ice);\n    box-shadow: inset 0 0 0 1.5px #cfe0f6;\n}\n\n.tile--tool:hover .tile__icon {\n    color: #fff;\n    background: var(--blue);\n}\n\n/* ================= ABOUT ME ================= */\n.about-me {\n    margin: 24px 18px 0;\n    padding: 18px;\n    text-align: left;\n    background: var(--mist);\n    border: 1px solid var(--line);\n    border-radius: var(--r-tile);\n}\n\n.about-me .block__title {\n    padding: 0;\n    margin-bottom: 10px;\n}\n\n.about-me p {\n    font-size: 14.5px;\n    line-height: 1.7;\n    color: var(--muted);\n}\n\n/* ================= INFO BOXES ================= */\n.info-boxes {\n    display: grid;\n    grid-template-columns: repeat(3, minmax(0, 1fr));\n    gap: 8px;\n    margin: 16px 18px 22px;\n}\n\n.info-box {\n    min-width: 0;\n    padding: 16px 6px 14px;\n    border-radius: 16px;\n    border: 1px solid var(--line);\n    background: linear-gradient(160deg, #fff, #eef5ff);\n}\n\n.info-icon {\n    width: 38px;\n    height: 38px;\n    margin: 0 auto 10px;\n    display: grid;\n    place-items: center;\n    border-radius: 50%;\n    font-size: 16px;\n    color: var(--blue);\n    background: var(--ice);\n}\n\n.smile-box .info-icon {\n    color: #c98100;\n    background: #fff1d1;\n}\n\n.info-number {\n    font-size: 15px;\n    font-weight: 800;\n    line-height: 1.25;\n    color: var(--navy);\n    overflow-wrap: anywhere;\n}\n\n.info-label {\n    margin-top: 4px;\n    font-size: 12px;\n    color: var(--muted);\n}\n\n/* ================= FEEDBACK CARD ================= */\n.feedback-heading {\n    padding: 28px 22px 44px;\n    color: #fff;\n    background: linear-gradient(135deg, #1c5fc0 0%, #2878df 50%, #4b9cff 100%);\n    border-radius: 0 0 50% 50% / 0 0 30px 30px;\n}\n\n.feedback-heading h2 {\n    font-size: 23px;\n    font-weight: 800;\n    letter-spacing: -0.02em;\n    margin-bottom: 6px;\n}\n\n.feedback-heading p {\n    font-size: 13.5px;\n    line-height: 1.5;\n    color: rgba(255, 255, 255, 0.88);\n}\n\n#feedbackForm {\n    padding: 24px 22px 0;\n    text-align: left;\n}\n\n.rating-label {\n    margin-bottom: 10px;\n    font-size: 13.5px;\n    font-weight: 700;\n    color: var(--navy);\n}\n\n.optional {\n    font-size: 12px;\n    font-weight: 500;\n    color: #8795a9;\n}\n\n/* ---------- stars ---------- */\n.star-rating {\n    display: flex;\n    justify-content: center;\n    gap: 6px;\n    margin: 4px 0;\n}\n\n.star {\n    padding: 0 2px;\n    border: 0;\n    background: transparent;\n    color: #d5deeb;\n    font-size: 40px;\n    line-height: 1;\n    cursor: pointer;\n    transition: transform 0.2s var(--ease), color 0.2s;\n}\n\n.star:hover { transform: scale(1.15); }\n\n.star.active {\n    color: var(--sun);\n    animation: starPop 0.35s var(--ease);\n}\n\n@keyframes starPop {\n    0%   { transform: scale(0.7); }\n    60%  { transform: scale(1.25); }\n    100% { transform: scale(1); }\n}\n\n.rating-hint {\n    margin: 8px 0 22px;\n    text-align: center;\n    font-size: 12.5px;\n    color: var(--muted);\n}\n\n/* ---------- chips ---------- */\n.suggestion-group {\n    margin: 20px 0;\n}\n\n.suggestion-chips {\n    display: grid;\n    grid-template-columns: repeat(2, minmax(0, 1fr));\n    gap: 8px;\n}\n\n.suggestion-chip {\n    position: relative;\n    min-width: 0;\n    display: flex;\n    cursor: pointer;\n}\n\n.suggestion-chip input[type=\"checkbox\"] {\n    position: absolute;\n    width: 1px;\n    height: 1px;\n    opacity: 0;\n    overflow: hidden;\n}\n\n.suggestion-chip span {\n    width: 100%;\n    min-height: 42px;\n    display: flex;\n    align-items: center;\n    padding: 8px 12px;\n    border: 1.5px solid var(--line);\n    border-radius: var(--r-field);\n    background: var(--mist);\n    color: #40516b;\n    font-size: 12.5px;\n    font-weight: 500;\n    line-height: 1.35;\n    overflow-wrap: anywhere;\n    transition: background 0.2s, border-color 0.2s, color 0.2s, transform 0.2s var(--ease);\n}\n\n.suggestion-chip:active span { transform: scale(0.97); }\n\n.suggestion-chip input:checked + span {\n    color: #fff;\n    font-weight: 600;\n    border-color: var(--blue);\n    background: linear-gradient(120deg, var(--blue-deep), var(--sky));\n}\n\n.suggestion-chip.improvement input:checked + span {\n    color: #7a4d00;\n    border-color: var(--sun);\n    background: #fff1d1;\n}\n\n.suggestion-chip:focus-within span {\n    outline: 3px solid rgba(40, 120, 223, 0.4);\n    outline-offset: 2px;\n}\n\n/* ---------- fields ---------- */\n.review-label {\n    display: block;\n    margin: 18px 0 8px;\n    font-size: 13.5px;\n    font-weight: 700;\n    color: var(--navy);\n}\n\n#feedbackForm textarea,\n#feedbackForm input[type=\"text\"] {\n    display: block;\n    width: 100%;\n    min-width: 0;\n    padding: 13px 14px;\n    border: 1.5px solid var(--line);\n    border-radius: var(--r-field);\n    background: #fbfdff;\n    color: var(--ink);\n    font-size: 14px;\n    outline: none;\n    transition: border-color 0.2s, box-shadow 0.2s;\n}\n\n#feedbackForm textarea {\n    min-height: 110px;\n    resize: vertical;\n    line-height: 1.6;\n}\n\n#feedbackForm textarea:focus,\n#feedbackForm input[type=\"text\"]:focus {\n    border-color: var(--blue);\n    box-shadow: 0 0 0 4px rgba(40, 120, 223, 0.14);\n}\n\n.submit-review {\n    width: 100%;\n    min-height: 52px;\n    margin-top: 20px;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    gap: 9px;\n    border: 0;\n    border-radius: var(--r-field);\n    color: #fff;\n    background: linear-gradient(120deg, var(--blue-deep), var(--sky));\n    font-size: 15px;\n    font-weight: 700;\n    cursor: pointer;\n    box-shadow: 0 12px 24px rgba(40, 120, 223, 0.32);\n    transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease);\n}\n\n.submit-review:hover { transform: translateY(-2px); }\n.submit-review:active { transform: scale(0.98); }\n\n.feedback-status {\n    min-height: 20px;\n    margin-top: 12px;\n    text-align: center;\n    font-size: 12.5px;\n    font-weight: 500;\n    color: var(--ok);\n    overflow-wrap: anywhere;\n}\n\n/* ---------- recent feedback ---------- */\n.recent-feedback {\n    margin: 22px 22px 26px;\n    padding-top: 20px;\n    text-align: left;\n    border-top: 2px dashed var(--line);\n}\n\n.recent-heading {\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n    gap: 10px;\n    margin-bottom: 12px;\n}\n\n.recent-heading h3 {\n    font-size: 16px;\n    font-weight: 800;\n    color: var(--navy);\n}\n\n.local-note {\n    font-size: 11.5px;\n    text-align: right;\n    color: #8795a9;\n}\n\n.review-list {\n    display: grid;\n    gap: 10px;\n}\n\n.empty-reviews {\n    padding: 16px 5px;\n    text-align: center;\n    font-size: 13px;\n    color: #8795a9;\n}\n\n.review-card {\n    padding: 14px;\n    border: 1px solid var(--line);\n    border-radius: var(--r-field);\n    background: var(--mist);\n    animation: rise 0.45s var(--ease) both;\n}\n\n.review-card-top {\n    display: flex;\n    justify-content: space-between;\n    align-items: flex-start;\n    gap: 8px;\n    margin-bottom: 7px;\n}\n\n.review-author {\n    font-size: 13px;\n    font-weight: 700;\n    color: var(--navy);\n    overflow-wrap: anywhere;\n}\n\n.review-stars {\n    font-size: 13px;\n    letter-spacing: 1px;\n    white-space: nowrap;\n    color: var(--sun);\n}\n\n.review-copy {\n    font-size: 13px;\n    line-height: 1.6;\n    color: #52627a;\n    overflow-wrap: anywhere;\n}\n\n.review-date {\n    margin-top: 8px;\n    font-size: 11.5px;\n    color: #8795a9;\n}\n\n/* ================= POPUP + TOAST ================= */\n.qmodal {\n    position: fixed;\n    inset: 0;\n    z-index: 1000;\n    display: grid;\n    place-items: center;\n    padding: 16px;\n    background: rgba(10, 37, 64, 0.6);\n    -webkit-backdrop-filter: blur(4px);\n    backdrop-filter: blur(4px);\n}\n\n.qmodal[hidden] { display: none; }\n\n.qmodal__box {\n    position: relative;\n    width: min(380px, 100%);\n    max-height: 88vh;\n    overflow-y: auto;\n    padding: 26px 24px 24px;\n    border-radius: var(--r-card);\n    background: #fff;\n    color: var(--ink);\n    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.3);\n    animation: pop 0.35s var(--ease) both;\n}\n\n.qmodal__box h3 {\n    margin-bottom: 12px;\n    padding-right: 30px;\n    font-size: 18px;\n    font-weight: 800;\n    color: var(--navy);\n}\n\n.qmodal__box p {\n    margin: 0 0 14px;\n    font-size: 14px;\n    line-height: 1.6;\n    color: var(--muted);\n}\n\n.qmodal__close {\n    position: absolute;\n    top: 10px;\n    right: 14px;\n    border: 0;\n    background: none;\n    color: #8795a9;\n    font-size: 28px;\n    line-height: 1;\n    cursor: pointer;\n}\n\n.qmodal__center { text-align: center; }\n\n.qmodal__center img {\n    display: block;\n    margin: 0 auto 12px;\n    border-radius: var(--r-field);\n    border: 1px solid var(--line);\n}\n\n.qbtn {\n    display: inline-block;\n    padding: 11px 20px;\n    border-radius: 999px;\n    color: #fff;\n    background: linear-gradient(120deg, var(--blue-deep), var(--sky));\n    font-size: 13.5px;\n    font-weight: 700;\n    text-decoration: none;\n}\n\n.qtoast {\n    position: fixed;\n    left: 50%;\n    bottom: 24px;\n    z-index: 1100;\n    padding: 11px 22px;\n    border-radius: 999px;\n    background: var(--navy);\n    color: #fff;\n    font-size: 13px;\n    font-weight: 600;\n    opacity: 0;\n    pointer-events: none;\n    transform: translate(-50%, 20px);\n    transition: opacity 0.25s, transform 0.25s var(--ease);\n}\n\n.qtoast.is-show {\n    opacity: 1;\n    transform: translate(-50%, 0);\n}\n\n/* ================= SMALL SCREENS ================= */\n@media (max-width: 380px) {\n    .page { padding: 14px 10px 56px; }\n\n    .tile__icon { width: 50px; height: 50px; font-size: 22px; }\n    .tile { font-size: 11.5px; }\n\n    .block { padding-left: 12px; padding-right: 12px; }\n    .about-me,\n    .info-boxes { margin-left: 12px; margin-right: 12px; }\n\n    #feedbackForm { padding-left: 16px; padding-right: 16px; }\n    .recent-feedback { margin-left: 16px; margin-right: 16px; }\n\n    .suggestion-chip span { padding: 8px 9px; font-size: 12px; }\n    .star { font-size: 35px; }\n    .info-number { font-size: 14px; }\n}\n\n/* ================= REDUCED MOTION ================= */\n@media (prefers-reduced-motion: reduce) {\n    html { scroll-behavior: auto; }\n\n    .js .reveal {\n        opacity: 1;\n        transform: none;\n    }\n\n    *,\n    *::before,\n    *::after {\n        animation: none !important;\n        transition-duration: 0.01ms !important;\n    }\n}","script.js":"\n// ================= PROFILE DETAILS =================\nconst CFG = window.CARD || {};\nconst userName = CFG.name || \"Digital ID\";\n\nconst nameParts = userName.trim().split(/\\s+/).filter(Boolean);\n\nconst initials = nameParts.length > 1\n    ? (nameParts[0][0] + nameParts[nameParts.length - 1][0]).toUpperCase()\n    : (nameParts[0] || \"U\").slice(0, 2).toUpperCase();\n\nconst profileName = document.getElementById(\"profileName\");\n\nif (profileName) {\n    profileName.textContent = userName;\n}\n\n\n// ================= GOOGLE MAPS LOCATION =================\nconst MAP_URL = CFG.mapUrl || \"\";\nconst CALL_NUMBER = CFG.phone || \"\";\n\nfunction getLocation() {\n    if (!MAP_URL) return;\n    window.open(MAP_URL, \"_blank\", \"noopener,noreferrer\");\n}\n\n\n// ================= WHATSAPP CONTACT =================\nconst whatsappNumber = String(CFG.whatsapp ?? \"\").replace(/\\D/g, \"\");\n\nconst whatsappMessage =\n    CFG.waMessage || \"Hello! I would like to know more.\";\n\nconst whatsappLink = document.getElementById(\"whatsappLink\");\n\nif (whatsappLink) {\n    whatsappLink.href = whatsappNumber\n        ? `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(whatsappMessage)}`\n        : \"#\";\n\n    whatsappLink.target = \"_blank\";\n    whatsappLink.rel = \"noopener noreferrer\";\n}\n\n\n// ================= FEEDBACK SYSTEM =================\n(() => {\n    const form = document.getElementById(\"feedbackForm\");\n\n    if (!form) {\n        console.error(\"Feedback form not found.\");\n        return;\n    }\n\n    const stars = [...form.querySelectorAll(\".star\")];\n    const ratingHint = document.getElementById(\"ratingHint\");\n    const reviewText = document.getElementById(\"reviewText\");\n    const reviewerName = document.getElementById(\"reviewerName\");\n    const status = document.getElementById(\"feedbackStatus\");\n    const reviewList = document.getElementById(\"reviewList\");\n\n    const storageKey = \"digitalIdReviews\";\n\n    // ================= GOOGLE REVIEW SETTINGS (EDIT HERE) =================\n    // Paste your OFFICIAL Google review link between the quotes below.\n    // Get it from your Google Business Profile:\n    //   Business Profile > \"Get more reviews\" (or \"Ask for reviews\") > Copy link\n    // It normally looks like:  https://g.page/r/XXXXXXXXXXXX/review\n    // If this is empty or not a valid review link, the site opens your\n    // Google Maps listing instead, and the customer must tap \"Write a review\".\n    const GOOGLE_REVIEW_URL = CFG.googleReview || \"\";\n\n    // Fallback only: your ordinary Google Maps listing page.\n    // This does NOT open the review form by itself.\n    const GOOGLE_LISTING_URL =\n        CFG.googleListing || \"\";\n\n    // Only these hosts are accepted, so a typo can never send customers elsewhere.\n    const ALLOWED_GOOGLE_HOSTS = [\n        \"g.page\",\n        \"search.google.com\",\n        \"www.google.com\",\n        \"google.com\",\n        \"maps.app.goo.gl\",\n        \"goo.gl\"\n    ];\n\n    let selectedRating = 0;\n    let reviewWasEdited = false;\n\n    const ratingWords = {\n        1: \"poor\",\n        2: \"fair\",\n        3: \"good\",\n        4: \"very good\",\n        5: \"excellent\"\n    };\n\n\n    // ---------- STATUS MESSAGE ----------\n    function showStatus(message, color = \"#b45309\") {\n        if (status) {\n            status.textContent = message;\n            status.style.color = color;\n        }\n    }\n\n\n    // ---------- STAR RATING ----------\n    function updateStars(rating) {\n        selectedRating = rating;\n\n        stars.forEach((star) => {\n            const starRating = Number(star.dataset.rating);\n            const active = starRating <= rating;\n\n            star.classList.toggle(\"active\", active);\n            star.setAttribute(\n                \"aria-pressed\",\n                String(starRating === rating)\n            );\n        });\n\n        if (ratingHint) {\n            ratingHint.textContent = rating\n                ? `${rating} out of 5 stars — ${ratingWords[rating]}`\n                : \"Tap a star to rate us\";\n        }\n\n        generateSentence();\n    }\n\n\n    // ---------- SELECTED SUGGESTIONS ----------\n    function selectedValues(name) {\n        return [\n            ...form.querySelectorAll(\n                `input[name=\"${name}\"]:checked`\n            )\n        ].map((input) => input.value);\n    }\n\n\n    // ---------- GENERATE REVIEW TEXT ----------\n    function generateSentence() {\n        if (!reviewText || reviewWasEdited) return;\n\n        const positives = selectedValues(\"positive\");\n        const improvements = selectedValues(\"improvement\");\n        const parts = [];\n\n        if (selectedRating) {\n            parts.push(\n                `My experience with ${userName} was ${ratingWords[selectedRating]}`\n            );\n        } else if (positives.length) {\n            parts.push(\n                `My experience with ${userName} was enjoyable`\n            );\n        }\n\n        if (positives.length) {\n            const list = positives.length === 1\n                ? positives[0]\n                : positives.slice(0, -1).join(\", \") +\n                  \" and \" +\n                  positives[positives.length - 1];\n\n            parts.push(`I especially appreciated the ${list}`);\n        }\n\n        let sentence = parts.length\n            ? parts.join(\". \") + \".\"\n            : \"\";\n\n        if (improvements.length) {\n            sentence += (sentence ? \" \" : \"\") +\n                `I would appreciate ${improvements.join(\" and \")} in the future.`;\n        }\n\n        reviewText.value = sentence;\n    }\n\n\n    // ---------- STAR CLICK EVENTS ----------\n    stars.forEach((star) => {\n        star.addEventListener(\"click\", () => {\n            const rating = Number(star.dataset.rating);\n\n            if (rating < 1 || rating > 5) return;\n\n            reviewWasEdited = false;\n            updateStars(rating);\n        });\n    });\n\n\n    // ---------- SUGGESTION CHECKBOXES ----------\n    form.querySelectorAll('input[type=\"checkbox\"]').forEach((input) => {\n        input.addEventListener(\"change\", () => {\n            reviewWasEdited = false;\n            generateSentence();\n        });\n    });\n\n\n    // ---------- MANUAL REVIEW EDITING ----------\n    if (reviewText) {\n        reviewText.addEventListener(\"input\", () => {\n            reviewWasEdited = true;\n        });\n    }\n\n\n    // ---------- READ LOCAL REVIEWS ----------\n    function getReviews() {\n        try {\n            const value = JSON.parse(\n                localStorage.getItem(storageKey) || \"[]\"\n            );\n\n            return Array.isArray(value) ? value : [];\n        } catch (error) {\n            console.error(\"Unable to read saved reviews:\", error);\n            return [];\n        }\n    }\n\n\n    // ---------- ESCAPE HTML ----------\n    function escapeHTML(value) {\n        return String(value ?? \"\").replace(/[&<>\"']/g, (char) => ({\n            \"&\": \"&amp;\",\n            \"<\": \"&lt;\",\n            \">\": \"&gt;\",\n            '\"': \"&quot;\",\n            \"'\": \"&#39;\"\n        })[char]);\n    }\n\n\n    // ---------- DISPLAY LOCAL REVIEWS ----------\n    function renderReviews() {\n        if (!reviewList) return;\n\n        const reviews = getReviews();\n\n        if (!reviews.length) {\n            reviewList.innerHTML =\n                '<p class=\"empty-reviews\">Your feedback will appear here after submission.<\/p>';\n            return;\n        }\n\n        reviewList.innerHTML = reviews.slice(0, 5).map((review) => {\n            const safeName = escapeHTML(review.name || \"Guest\");\n            const safeText = escapeHTML(review.text);\n\n            const rating = Math.max(\n                0,\n                Math.min(5, Number(review.rating) || 0)\n            );\n\n            const starsText =\n                \"★\".repeat(rating) + \"☆\".repeat(5 - rating);\n\n            const date = new Date(review.date);\n\n            const dateText = Number.isNaN(date.getTime())\n                ? \"\"\n                : date.toLocaleDateString();\n\n            return `\n                <article class=\"review-card\">\n                    <div class=\"review-card-top\">\n                        <span class=\"review-author\">${safeName}<\/span>\n                        <span class=\"review-stars\"\n                              aria-label=\"${rating} out of 5 stars\">\n                            ${starsText}\n                        <\/span>\n                    <\/div>\n                    <p class=\"review-copy\">${safeText}<\/p>\n                    <p class=\"review-date\">${dateText}<\/p>\n                <\/article>\n            `;\n        }).join(\"\");\n    }\n\n\n    // ---------- GOOGLE DESTINATION ----------\n    function parseGoogleUrl(value) {\n        if (typeof value !== \"string\" || !value.trim()) return null;\n\n        try {\n            const url = new URL(value.trim());\n\n            if (\n                url.protocol !== \"https:\" ||\n                !ALLOWED_GOOGLE_HOSTS.includes(url.hostname)\n            ) {\n                return null;\n            }\n\n            return url;\n        } catch (error) {\n            return null;\n        }\n    }\n\n    // A \"dedicated\" link is one of Google's official review-form formats.\n    function isDedicatedReviewUrl(url) {\n        if (!url) return false;\n\n        const isGooglePageLink =\n            url.hostname === \"g.page\" &&\n            /^\\/r\\/[^/]+\\/review\\/?$/.test(url.pathname);\n\n        const isWriteReviewLink =\n            url.hostname === \"search.google.com\" &&\n            url.pathname === \"/local/writereview\" &&\n            Boolean(url.searchParams.get(\"placeid\"));\n\n        return isGooglePageLink || isWriteReviewLink;\n    }\n\n    function resolveGoogleDestination() {\n        const reviewUrl = parseGoogleUrl(GOOGLE_REVIEW_URL);\n\n        if (reviewUrl && isDedicatedReviewUrl(reviewUrl)) {\n            return { href: reviewUrl.href, dedicated: true };\n        }\n\n        if (GOOGLE_REVIEW_URL.trim()) {\n            console.warn(\n                \"GOOGLE_REVIEW_URL is not a recognised Google review link. \" +\n                \"Expected https://g.page/r/.../review. Using the listing page instead.\"\n            );\n        }\n\n        const listingUrl = parseGoogleUrl(GOOGLE_LISTING_URL);\n\n        return listingUrl\n            ? { href: listingUrl.href, dedicated: false }\n            : null;\n    }\n\n\n    // ---------- COPY REVIEW TEXT ----------\n    function legacyCopy(text) {\n        const helper = document.createElement(\"textarea\");\n\n        helper.value = text;\n        helper.setAttribute(\"readonly\", \"\");\n        helper.style.position = \"fixed\";\n        helper.style.top = \"0\";\n        helper.style.left = \"-9999px\";\n        helper.style.opacity = \"0\";\n\n        document.body.appendChild(helper);\n\n        try {\n            helper.focus();\n            helper.select();\n            helper.setSelectionRange(0, text.length);\n\n            return document.execCommand(\"copy\");\n        } finally {\n            document.body.removeChild(helper);\n        }\n    }\n\n    async function copyReviewText(text) {\n        // Modern clipboard API (needs HTTPS and may be blocked by the browser).\n        try {\n            if (navigator.clipboard?.writeText && window.isSecureContext) {\n                await Promise.race([\n                    navigator.clipboard.writeText(text),\n                    new Promise((_, reject) =>\n                        setTimeout(\n                            () => reject(new Error(\"Clipboard request timed out\")),\n                            1500\n                        )\n                    )\n                ]);\n\n                return true;\n            }\n        } catch (error) {\n            console.warn(\"Clipboard API unavailable or blocked:\", error);\n        }\n\n        // Older-browser fallback.\n        try {\n            return legacyCopy(text);\n        } catch (error) {\n            console.warn(\"Fallback copy failed:\", error);\n            return false;\n        }\n    }\n\n\n    // ---------- SUBMIT FEEDBACK ----------\n    const submitButton = form.querySelector('button[type=\"submit\"]');\n\n    // Fallback buttons are created here in JavaScript (no HTML changes needed).\n    // They reuse the existing \"submit-review\" button style and stay hidden\n    // unless automatic copying fails.\n    function createFallbackButton(id, iconClass, label) {\n        const button = document.createElement(\"button\");\n        const icon = document.createElement(\"i\");\n\n        button.id = id;\n        button.type = \"button\";\n        button.className = \"submit-review\";\n\n        icon.className = iconClass;\n        icon.setAttribute(\"aria-hidden\", \"true\");\n\n        button.appendChild(icon);\n        button.appendChild(document.createTextNode(\" \" + label));\n\n        return button;\n    }\n\n    const copyReviewBtn = createFallbackButton(\n        \"copyReviewBtn\",\n        \"fa-solid fa-copy\",\n        \"Copy review\"\n    );\n\n    const continueGoogleBtn = createFallbackButton(\n        \"continueGoogleBtn\",\n        \"fa-brands fa-google\",\n        \"Continue to Google\"\n    );\n\n    const fallbackPanel = document.createElement(\"div\");\n\n    fallbackPanel.id = \"reviewFallback\";\n    fallbackPanel.hidden = true;\n    fallbackPanel.appendChild(copyReviewBtn);\n    fallbackPanel.appendChild(continueGoogleBtn);\n\n    if (status && status.parentNode) {\n        status.parentNode.insertBefore(fallbackPanel, status.nextSibling);\n    } else {\n        form.appendChild(fallbackPanel);\n    }\n\n    let isRedirecting = false;\n    let pending = null; // { text, destination } for the current submission\n\n    function setSubmitting(active) {\n        isRedirecting = active;\n\n        if (submitButton) {\n            submitButton.disabled = active;\n            submitButton.style.opacity = active ? \"0.7\" : \"\";\n        }\n\n        if (!active && fallbackPanel) {\n            fallbackPanel.hidden = true;\n        }\n    }\n\n    // ---------- OPEN GOOGLE ----------\n    function openGoogle(destination) {\n        try {\n            window.location.assign(destination.href);\n        } catch (error) {\n            console.error(\"Could not open Google:\", error);\n            setSubmitting(false);\n            showStatus(\n                \"Could not open Google automatically. Please search for \" + userName + \" on Google Maps to leave your review.\"\n            );\n        }\n    }\n\n    // ---------- FALLBACK BUTTONS (shown only if auto-copy fails) ----------\n    // A fresh tap counts as a user gesture, so copying usually works here.\n    if (copyReviewBtn) {\n        copyReviewBtn.addEventListener(\"click\", async () => {\n            if (!pending) return;\n\n            const ok = await copyReviewText(pending.text);\n\n            if (ok) {\n                showStatus(\n                    \"Review copied. Now tap Continue to Google and paste it there.\",\n                    \"#16734a\"\n                );\n            } else {\n                if (reviewText) {\n                    reviewText.focus();\n                    reviewText.select();\n                }\n\n                showStatus(\n                    \"Still could not copy. Press and hold your review text above and choose Copy, then tap Continue to Google.\"\n                );\n            }\n        });\n    }\n\n    if (continueGoogleBtn) {\n        continueGoogleBtn.addEventListener(\"click\", () => {\n            if (pending) {\n                openGoogle(pending.destination);\n            }\n        });\n    }\n\n    // Re-enable the button if the customer returns with the Back button.\n    window.addEventListener(\"pageshow\", (event) => {\n        if (event.persisted) {\n            setSubmitting(false);\n        }\n    });\n\n    if (!parseGoogleUrl(GOOGLE_REVIEW_URL)) {\n        console.warn(\n            \"No official Google review link set. Edit GOOGLE_REVIEW_URL in script.js.\"\n        );\n    }\n\n    form.addEventListener(\"submit\", async (event) => {\n        event.preventDefault();\n\n        if (isRedirecting) return;\n\n        // Validate star rating.\n        if (!selectedRating) {\n            showStatus(\"Please select a star rating first.\");\n            return;\n        }\n\n        // Validate review text.\n        const text = reviewText\n            ? reviewText.value.trim()\n            : \"\";\n\n        if (!text) {\n            showStatus(\"Please select a suggestion or write your review.\");\n\n            if (reviewText) {\n                reviewText.focus();\n            }\n\n            return;\n        }\n\n        // Check the destination before saving anything.\n        const destination = resolveGoogleDestination();\n\n        if (!destination) {\n            // No Google link configured: keep a local copy and thank the visitor.\n            try {\n                const saved = getReviews();\n                saved.unshift({\n                    name: reviewerName?.value.trim() || \"Guest\",\n                    rating: selectedRating,\n                    text: text,\n                    date: new Date().toISOString()\n                });\n                localStorage.setItem(storageKey, JSON.stringify(saved.slice(0, 30)));\n                renderReviews();\n            } catch (error) {}\n\n            form.reset();\n            reviewWasEdited = false;\n            updateStars(0);\n            showStatus(\"Thank you for your feedback!\", \"#16734a\");\n            return;\n        }\n\n        setSubmitting(true);\n\n        // Create the feedback record.\n        const review = {\n            name: reviewerName?.value.trim() || \"Guest\",\n            rating: selectedRating,\n            text: text,\n            date: new Date().toISOString()\n        };\n\n        // Save feedback in this browser's local storage (this device only).\n        let savedLocally = false;\n\n        try {\n            const reviews = getReviews();\n\n            reviews.unshift(review);\n\n            localStorage.setItem(\n                storageKey,\n                JSON.stringify(reviews.slice(0, 30))\n            );\n\n            savedLocally = true;\n            renderReviews();\n        } catch (error) {\n            console.warn(\"Local review saving failed:\", error);\n        }\n\n        // Try copying the review text for the customer.\n        const copied = await copyReviewText(text);\n\n        pending = { text, destination };\n\n        // Status message shown BEFORE leaving the page.\n        // Nothing has been posted to Google at this point.\n        const steps = destination.dedicated\n            ? \"Google will open next. Sign in if asked, choose your stars, paste your text, and tap Post.\"\n            : \"Google Maps will open next. Tap \\\"Write a review\\\", choose your stars, paste your text, and tap Post.\";\n\n        const savedNote = savedLocally\n            ? \"\"\n            : \" (This device could not save a local copy.)\";\n\n        if (copied) {\n            showStatus(\n                `Your review text is copied. ${steps} It is not on Google until you post it there.${savedNote}`,\n                \"#16734a\"\n            );\n\n            // Give the customer time to read the message, then open Google.\n            setTimeout(() => openGoogle(destination), 2500);\n            return;\n        }\n\n        // Copy failed: do NOT redirect automatically. Let the customer copy\n        // the text first, then continue to Google themselves.\n        if (reviewText) {\n            reviewText.focus();\n            reviewText.select();\n        }\n\n        if (fallbackPanel) {\n            fallbackPanel.hidden = false;\n\n            showStatus(\n                `Could not copy automatically. Tap Copy review, then Continue to Google. It is not on Google until you post it there.${savedNote}`\n            );\n        } else {\n            // Panel missing from the HTML: fall back to a delayed redirect.\n            showStatus(\n                `Could not copy automatically, so your text is selected above. Please copy it now. ${steps}${savedNote}`\n            );\n\n            setTimeout(() => openGoogle(destination), 5000);\n        }\n    });\n\n\n    // ---------- INITIALIZE ----------\n    renderReviews();\n    updateStars(0);\n\n    console.log(\"Feedback system initialized successfully\");\n})();\n\n\n// ================= SAVE & SHARE TOOLS =================\n(function () {\n    \"use strict\";\n\n    var tools = document.getElementById(\"tools\");\n    var modal = document.getElementById(\"qmodal\");\n    var modalTitle = document.getElementById(\"qmodalTitle\");\n    var modalBody = document.getElementById(\"qmodalBody\");\n    var modalClose = document.getElementById(\"qmodalClose\");\n    var toastEl = document.getElementById(\"qtoast\");\n\n    if (!tools || !modal) return;\n\n    function pageUrl() {\n        return (CFG.siteUrl || location.href).split(\"#\")[0];\n    }\n\n    function toast(msg) {\n        if (!toastEl) return;\n\n        toastEl.textContent = msg;\n        toastEl.classList.add(\"is-show\");\n\n        clearTimeout(toast.t);\n\n        toast.t = setTimeout(function () {\n            toastEl.classList.remove(\"is-show\");\n        }, 2200);\n    }\n\n    function copyText(text) {\n        if (navigator.clipboard && window.isSecureContext) {\n            return navigator.clipboard.writeText(text);\n        }\n\n        return new Promise(function (resolve, reject) {\n            var ta = document.createElement(\"textarea\");\n\n            ta.value = text;\n            ta.style.position = \"fixed\";\n            ta.style.opacity = \"0\";\n\n            document.body.appendChild(ta);\n            ta.select();\n\n            var ok = false;\n\n            try {\n                ok = document.execCommand(\"copy\");\n            } catch (e) {}\n\n            document.body.removeChild(ta);\n\n            ok ? resolve() : reject();\n        });\n    }\n\n    // ---------- MODAL ----------\n    function openModal(title, html) {\n        modalTitle.textContent = title;\n        modalBody.innerHTML = html;\n        modal.hidden = false;\n        document.body.style.overflow = \"hidden\";\n\n        modalClose?.focus({ preventScroll: true });\n    }\n\n    function closeModal() {\n        modal.hidden = true;\n        document.body.style.overflow = \"\";\n    }\n\n    if (modalClose) {\n        modalClose.addEventListener(\"click\", closeModal);\n    }\n\n    modal.addEventListener(\"click\", function (e) {\n        if (e.target === modal) closeModal();\n    });\n\n    document.addEventListener(\"keydown\", function (e) {\n        if (e.key === \"Escape\" && !modal.hidden) {\n            closeModal();\n        }\n    });\n\n    // ---------- SHARE ----------\n    function share() {\n        var data = {\n            title: userName,\n            text: \"Check out \" + userName + (CFG.tagline ? \" \\u2013 \" + CFG.tagline : \"\"),\n            url: pageUrl()\n        };\n\n        if (navigator.share) {\n            navigator.share(data).catch(function () {});\n        } else {\n            copyLink();\n        }\n    }\n\n    function copyLink() {\n        copyText(pageUrl()).then(\n            function () {\n                toast(\"Link copied\");\n            },\n            function () {\n                toast(\"Copy failed\");\n            }\n        );\n    }\n\n    // ---------- SAVE CONTACT ----------\n    function saveContact() {\n        var lines = [\n            \"BEGIN:VCARD\",\n            \"VERSION:3.0\",\n            \"N:;\" + userName + \";;;\",\n            \"FN:\" + userName,\n            \"ORG:\" + userName,\n            \"TITLE:\" + (CFG.tagline || \"\")\n        ];\n\n        if (CALL_NUMBER) lines.push(\"TEL;TYPE=WORK,VOICE:\" + CALL_NUMBER);\n        if (CFG.email) lines.push(\"EMAIL;TYPE=WORK:\" + CFG.email);\n        if (CFG.address) {\n            lines.push(\n                \"ADR;TYPE=WORK:;;\" +\n                String(CFG.address).replace(/[\\r\\n]+/g, \" \").replace(/([,;\\\\])/g, \"\\\\$1\") +\n                \";;;;\"\n            );\n        }\n        if (MAP_URL) lines.push(\"URL:\" + MAP_URL);\n\n        if (/^https?:/.test(pageUrl())) {\n            lines.push(\"URL:\" + pageUrl());\n        }\n\n        lines.push(\"END:VCARD\");\n\n        var blob = new Blob(\n            [lines.join(\"\\r\\n\")],\n            { type: \"text/vcard;charset=utf-8\" }\n        );\n\n        var a = document.createElement(\"a\");\n\n        a.href = URL.createObjectURL(blob);\n        a.download = userName.replace(/\\s+/g, \"-\") + \".vcf\";\n\n        document.body.appendChild(a);\n        a.click();\n        document.body.removeChild(a);\n\n        setTimeout(function () {\n            URL.revokeObjectURL(a.href);\n        }, 1000);\n\n        toast(\"Contact file downloaded\");\n    }\n\n    // ---------- QR CODE ----------\n    function showQr() {\n        var src =\n            \"https://api.qrserver.com/v1/create-qr-code/?size=240x240&margin=8&data=\" +\n            encodeURIComponent(pageUrl());\n\n        openModal(\n            \"Scan QR code\",\n            '<div class=\"qmodal__center\">' +\n                '<img src=\"' + src +\n                '\" alt=\"QR code for this card\" width=\"240\" height=\"240\">' +\n                \"<p>Scan to open this digital card on another phone.<\/p>\" +\n                '<a class=\"qbtn\" href=\"' + src +\n                '\" download=\"qr-code.png\" target=\"_blank\" rel=\"noopener\">Download QR<\/a>' +\n            \"<\/div>\"\n        );\n    }\n\n    var actions = {\n        save: saveContact,\n        share: share,\n        copy: copyLink,\n        qr: showQr\n    };\n\n    tools.addEventListener(\"click\", function (e) {\n        var btn = e.target.closest(\"[data-action]\");\n\n        if (!btn) return;\n\n        var run = actions[btn.getAttribute(\"data-action\")];\n\n        if (run) run();\n    });\n})();\n\n\n// = function openTest() {

    items.map(function (it, i) {

    }).join("") + '</ul><div class="row" style="margin-top:12px"><button id="tlAgain">Test again</button></div><p id="tlSum" class="hint"></p>');

$("#bTest").onclick = openTest;
$("#mb").addEventListener("click", function (e) { if (e.target.id === "tlAgain") openTest(); });

/* ---------------- QR poster (canvas -> PNG / PDF, no outside services) ---------------- */
function loadImg(src) { return new Promise(function (ok) { if (!/^data:image\//.test(src || "")) return ok(null); var i = new Image(); i.onload = function () { ok(i); }; i.onerror = function () { ok(null); }; i.src = src; }); }

  words.forEach(function (w) { var t = cur ? cur + " " + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; });
  if (cur) lines.push(cur);

}
function posterUrl(ref) {
  try { var u = new URL(cfg.siteUrl); if (ref) u.searchParams.set("ref", "poster"); return u.href; } catch (e) { return ""; }
}
function posterDefaults() { var p = P.poster = P.poster || {}; return { head: p.head != null ? p.head : "Scan to open our digital card", sub: p.sub != null ? p.sub : "Call, WhatsApp, find us on the map and leave a review – all in one tap.", size: p.size || "A4", phone: p.phone !== false, url: p.url !== false, ref: p.ref !== false }; }
var posterTok = 0;
async function drawPoster(cv, o) {
  var tok = ++posterTok, big = o.size === "A5" ? { w: 874, h: 1240, pw: 420, ph: 595 } : { w: 1240, h: 1754, pw: 595, ph: 842 };

  var img = await loadImg(cfg.images.profile || cfg.images.logo);

  var FF = '"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif';
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);
  // header band
  var g = ctx.createLinearGradient(0, 0, W, 520 * s); g.addColorStop(0, th.primary); g.addColorStop(.5, th.secondary); g.addColorStop(1, th.light);
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(W, 0); ctx.lineTo(W, 470 * s); ctx.quadraticCurveTo(W / 2, 560 * s, 0, 470 * s); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.10)"; ctx.beginPath(); ctx.arc(W - 120 * s, 60 * s, 190 * s, 0, 7); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.07)"; ctx.beginPath(); ctx.arc(80 * s, 430 * s, 150 * s, 0, 7); ctx.fill();
  // photo / initials
  var cx = W / 2, cy = 190 * s, r = 100 * s;
  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.closePath(); ctx.clip();

    var f = (cfg.images.profile ? cfg.images.profileFit : cfg.images.logoFit) || {}, z = Math.max(1, Math.min(3, Number(f.z) || 1)), px = isNaN(Number(f.x)) ? 50 : Number(f.x), py = isNaN(Number(f.y)) ? 50 : Number(f.y);

  } else { ctx.fillStyle = "rgba(255,255,255,.22)"; ctx.fillRect(cx - r, cy - r, 2 * r, 2 * r); ctx.fillStyle = "#fff"; ctx.font = "800 " + 86 * s + "px " + FF; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(initials(cfg.name), cx, cy + 4 * s); }
  ctx.restore();
  ctx.lineWidth = 8 * s; ctx.strokeStyle = "#fff"; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.stroke();
  // name + tagline
  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic"; ctx.fillStyle = "#fff";
  var fs = 80 * s; do { ctx.font = "800 " + fs + "px " + FF; fs -= 2; } while (ctx.measureText(cfg.name || "").width > 1040 * s && fs > 30 * s);
  ctx.fillText(cfg.name || "", cx, 392 * s);
  ctx.font = "600 " + 34 * s + "px " + FF; ctx.fillStyle = "rgba(255,255,255,.92)";

  ctx.fillStyle = "#0a1020";
  for (var rr = 0; rr < n; rr++) for (var cc = 0; cc < n; cc++) if (qr.isDark(rr, cc)) ctx.fillRect(ox + cc * m, oy + rr * m, m, m);

  if (o.phone && cfg.phone) { ctx.fillStyle = "#17243b"; ctx.font = "700 " + 36 * s + "px " + FF; ctx.fillText("Call: " + cfg.phone, cx, y + 16 * s); }

function jpegToPdf(jpg, w, h, pw, ph) {

  offs[3] = len; add("3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + pw + " " + ph + "] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>\nendobj\n");

var posterCfg = null, posterBig = null, posterT;
function openPoster() {
  if (!/^https?:\/\/\S+$/i.test(cfg.siteUrl || "")) {
    openModal("QR poster", '<p>The QR code needs the client\'s <b>live address</b>. Deploy the site first, then type its address in <b>Client project › Live site URL</b> (or set a custom domain in the domain notes and use the button there).</p><div class="row" style="margin-top:12px"><button id="pGo" class="pri">Go to Live site URL</button></div>');
    return;
  }
  var d = posterDefaults(); posterCfg = d;
  openModal("QR poster", '<div class="pgrid"><div><canvas id="pc"></canvas></div><div class="side">' +
    '<label>Heading<input class="f" data-pp="head"></label>' +
    '<label>Small text under the QR<textarea class="f" data-pp="sub"></textarea></label>' +
    '<label>Paper<select class="f" data-pp="size"><option>A4</option><option>A5</option></select></label>' +
    '<label class="ck"><input type="checkbox" data-pp="url"> Show the web address</label>' +
    '<label class="ck"><input type="checkbox" data-pp="phone"> Show the phone number</label>' +
    '<label class="ck"><input type="checkbox" data-pp="ref"> Add ?ref=poster so scans show as a source in the visit stats</label>' +
    '<div class="row"><button class="pri" id="pPdf">Download PDF</button><button id="pPng">Download PNG</button></div>' +

}
function redrawPoster() {
  var cv = $("#pc"); if (!cv) return;
  $("#pLink").textContent = posterUrl(posterCfg.ref);
  drawPoster(cv, posterCfg).then(function (b) { if (b) posterBig = b; });
}
$("#mb").addEventListener("input", function (e) {
  var k = e.target.dataset.pp; if (!k) return;
  posterCfg[k] = e.target.type === "checkbox" ? e.target.checked : e.target.value;
  P.poster = Object.assign({}, posterCfg); metaTouch();
  clearTimeout(posterT); posterT = setTimeout(redrawPoster, 150);
});
$("#mb").addEventListener("click", function (e) {
  var b = e.target.closest("button"); if (!b) return;
  if (b.id === "pGo") { closeModal(); var f = document.querySelector('[data-k="siteUrl"]'); if (f) { f.closest("details").open = true; f.scrollIntoView({ behavior: "smooth", block: "center" }); f.focus(); } }

    var cv = $("#pc"), name = slug(P.name) + "-qr-poster";
    drawPoster(cv, posterCfg).then(function (big) {

        var bin = atob(cv.toDataURL("image/jpeg", .93).split(",")[1]), u8 = new Uint8Array(bin.length);

$("#bPoster").onclick = openPoster;

function startGuards() {
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
  updateDlMark(); renderBk();
  setInterval(renderBk, 30 * 60 * 1000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) renderBk(); });
}

/* ---------------- start ---------------- */
Store.all().then(function (all) {
  projects = all.map(function (p) { p.cfg = normalize(p.cfg); p.notes = p.notes || {}; p.dlAt = p.dlAt || 0; return p; }).sort(function (a, b) { return (a.updatedAt || 0) - (b.updatedAt || 0); });
  if (!projects.length) { projects.push(mkProject("New client")); return Store.put(clone(projects[0])).then(function () { return projects[0]; }, function () { return projects[0]; }); }
  var last = localStorage.getItem("dids_last");
  return projects.filter(function (p) { return p.id === last; })[0] || projects[projects.length - 1];
}).then(openProject).then(startGuards);
})();
